<text x="51" y="602.5" font-size="12.5" font-family="Menlo,Consolas,monospace">+ setCurso(curso: Curso)</text>
<text x="51" y="620.0" font-size="12.5" font-family="Menlo,Consolas,monospace">+ toString(): String</text>
