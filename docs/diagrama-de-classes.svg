<text x="51" y="532.5" font-size="12.5" font-family="Menlo,Consolas,monospace">+ getIdentificacao(): String</text>
<text x="51" y="550.0" font-size="12.5" font-family="Menlo,Consolas,monospace">+ getMatricula(): int</text>
