<text x="541" y="479.5" font-size="12.5" font-family="Menlo,Consolas,monospace">- turno: String</text>
<text x="541" y="497.0" font-size="12.5" font-family="Menlo,Consolas,monospace">- disciplinas: List&lt;Disciplina&gt;</text>
