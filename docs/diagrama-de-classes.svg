<text x="51" y="166.0" font-size="12.5" font-family="Menlo,Consolas,monospace">+ Pessoa()</text>
<text x="51" y="183.5" font-size="12.5" font-family="Menlo,Consolas,monospace">+ Pessoa(nome: String, idade: int)</text>
<text x="51" y="201.0" font-size="12.5" font-family="Menlo,Consolas,monospace" font-style="italic">+ getIdentificacao(): String {abstract}</text>
<text x="51" y="218.5" font-size="12.5" font-family="Menlo,Consolas,monospace">+ getNome(): String</text>
<text x="51" y="236.0" font-size="12.5" font-family="Menlo,Consolas,monospace">+ setNome(nome: String)</text>
