<text x="541" y="637.5" font-size="12.5" font-family="Menlo,Consolas,monospace">+ setDisciplinas(List&lt;Disciplina&gt;)</text>
<text x="541" y="655.0" font-size="12.5" font-family="Menlo,Consolas,monospace">+ adicionarDisciplina(d: Disciplina)</text>
<text x="541" y="672.5" font-size="12.5" font-family="Menlo,Consolas,monospace">+ toString(): String</text>
